[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gagos"
dynamic = ["version"]
description = "Sovereign Intelligence Agentic AI-OS — local-first, memory-driven, security-gated, human-supervised."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Kumar Swapnil" },
]
keywords = ["ai", "os", "agents", "memory", "security", "supervised"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Minimal DIRECT dependencies only (loose >= bounds), for `pip install -e .`.
# requirements.txt is the exact-pinned, reproducible install lock (the full
# transitive closure) -- when adding a NEW direct import to aios/, add it to
# both files, not just this one.
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.28",
    "cryptography>=41.0",
    "faiss-cpu>=1.7",
    "fastapi>=0.100",
    "GitPython>=3.1",
    "httpx>=0.24",
    "networkx>=3.0",
    "numpy>=1.24",
    "prometheus-client>=0.20",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # Required at IMPORT time, not just at request time: FastAPI raises
    # "Form data requires python-multipart to be installed" while building the
    # route table for `/api/v1/knowledge/ingest` (aios/api/routes/memory.py),
    # so the whole app fails to start without it. It was present in the
    # requirements.txt freeze but never declared here -- and the README installs
    # from THIS file, so a fresh clone could not start the backend at all.
    # Found by the 2026-09-06 self-stranger test; a working local venv hid it
    # completely.
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2",
    "requests>=2.28",
    "scikit-learn>=1.0",
    "sentence-transformers>=2.0",
    "structlog>=23.0",
    "torch>=2.0",
    "typer>=0.9",
    "uvicorn[standard]>=0.20",
]

[project.optional-dependencies]
test = [
    "coverage>=7.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "radon>=6.0",
]
gemini = [
    "google-genai>=1.0",
]

[project.scripts]
aios = "aios.__main__:main"
gagos = "aios.launcher:main"

[project.urls]
Repository = "https://github.com/swap821/ai-editor"

[tool.setuptools.dynamic]
version = { attr = "aios.__version__" }

[tool.setuptools.packages.find]
include = ["aios*"]

[tool.ruff.format]
# FORMAT-ONLY exclusions. `formatter.exclude` is a different setting from
# `linter.exclude`, which is the whole reason this is expressible: `ruff check`
# still lints both paths below, so excluding them costs no lint coverage on the
# most security-critical code in the repo.
#
# Why these two, and why config rather than a list in CI:
#
#   aios/security/*.py    boot_attestation.compute_spine_hash reads every .py
#                         here with read_bytes() and hashes it. Reformatting one
#                         changes the spine hash and breaks
#                         verify_spine_integrity. AGENTS.md SS VIII also makes
#                         them RED to touch.
#
#   tests/golden/fixture  The golden harness calls this fixture "COMMITTED,
#                         never-changing". SelfAnalysisAgent flags long
#                         functions by LINE COUNT, so reformatting tangled.py
#                         moved it across the threshold and the analyzer's
#                         diagnosis changed. Measured 2026-09-07 as a CI failure
#                         (test_golden_findings_match) that an AST-equivalence
#                         check could not see -- the AST was identical; what
#                         changed was something that MEASURES the formatting.
#
# Declared here rather than as CI arguments so a local `ruff format .` cannot
# touch them either. The gate this replaces was a hand-maintained path list, and
# it went red because a file nobody remembered to add drifted. Config that the
# formatter itself honours cannot fall behind the same way.
#   training_ground/, lab/  These are the RUNTIME SANDBOX scope roots
#                         (aios/config.py SCOPE_ROOTS) -- the directories the
#                         agent creates files in while it works. Gating CI on
#                         their formatting would make the build fail on what a
#                         curriculum run happened to write, which is a fact
#                         about a mission, not about the repo. .gitignore
#                         already ignores new files there for the same reason;
#                         the ~29 tracked survivors predate that rule and stay
#                         tracked because gitignore never affects tracked files.
exclude = [
    "aios/security/*.py",
    "tests/golden/fixture/**/*.py",
    "training_ground/**/*.py",
    "lab/**/*.py",
]
