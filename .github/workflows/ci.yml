name: CI

# Cross-suite CI gate: backend pytest with coverage floor + marker discipline,
# frontend typecheck + unit tests + production build. Mirrors AGENTS.md.
# pytest.ini enforces strict markers (fast / slow / cloud); this workflow runs
# the full suite on every push/PR and applies the --cov-fail-under=85 gate.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, for the same reason release-authority already asks for
          # it. This suite runs tests/test_organ_release_conformance.py, which
          # shells out to verify_organ_contracts.py, which resolves the §VIII
          # spine-release attestation. That check requires the signed commit to
          # be an ancestor of HEAD -- anti-replay -- and `git merge-base
          # --is-ancestor` cannot answer that in a depth-1 clone. It fails
          # CLOSED, which is correct for a security control and which made a
          # valid operator signature look like an unapproved green spine.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Kept in lockstep with Dockerfile's `FROM python:3.12-slim` and the
          # repo-root .python-version pin - the coverage-gated suite must run
          # on the same interpreter the container ships (matters for the
          # C-extension-heavy stack: torch/faiss-cpu/numpy).
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install radon pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run test suite with coverage gate
        env:
          AIOS_VERIFICATION_AUTHORITY_KEY: "ci-verification-authority-key-32-bytes-long!"
          AIOS_PROMOTION_AUTHORITY_KEY: "ci-promotion-authority-key-32-bytes-long!!"
          CHECKPOINT_AUTHORITY_KEY: "ci-checkpoint-authority-key-32-bytes-long!"
        run: python -m pytest -q --cov=aios --cov-report=term-missing --cov-report=xml --cov-fail-under=85

  backend:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Backend matrix gate
        run: echo "Backend tests passed on all platforms"

  local-clerk-live:
    # Organs 35 and 37 have carried "no Ollama — live local clerk runtime
    # evidence needs live Ollama" for the whole campaign. Every proof for them
    # so far runs on fixtures: r15_runtime_proof's qualification probe drives a
    # canned client returning hand-written JSON, which proves the plumbing and
    # nothing about a real model.
    #
    # This job is the local-clerk twin of the executor topology in
    # release-authority: a real daemon, a real model, the real 16-case suite.
    #
    # Deliberately a SEPARATE job rather than a step in release-authority, so
    # pulling a model never lengthens the release gate's critical path.
    #
    # It does NOT require the model to pass qualification. A small CI-sized
    # model may well fail, and demanding a pass would create pressure to pick a
    # model that flatters the suite or to loosen the suite until something
    # passes. A model that fails and is therefore escalated away from the local
    # clerk is the safety rule working on real evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start a real Ollama daemon
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          # Poll rather than sleep: the daemon is ready when it answers, and a
          # fixed sleep either wastes time or races on a slow runner.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "ollama ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull the clerk model
        run: |
          docker exec ollama ollama pull "${AIOS_OLLAMA_MODEL}"
          docker exec ollama ollama list
          # Warm it. `pull` only downloads; the FIRST chat request also pays
          # model-load-into-RAM, and on a 2-core runner that pushed the first
          # turn past AIOS_LLM_TIMEOUT_S and failed the job with
          # "Ollama chat ... timed out" -- infrastructure, correctly caught by
          # the integrity gate but still a job that proves nothing.
          docker exec ollama ollama run "${AIOS_LLM_MODEL}" "say ok" || true
        env:
          AIOS_OLLAMA_MODEL: qwen2.5:0.5b

      - name: Prove the live local clerk runtime and qualification suite
        env:
          AIOS_OLLAMA_INTEGRATION: "1"
          AIOS_OLLAMA_MODEL: qwen2.5:0.5b
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          # Emit JUnit for the same reason organ 40's executor suite does: this
          # file gates on AIOS_OLLAMA_INTEGRATION, so in the twelve-condition
          # gate's own pytest run it is all-skipped and C7 correctly reports
          # that nothing was proven. Organs 35 and 37 declare it as their
          # integration suite, so the gate has to see THIS run -- the one with
          # a real Ollama daemon behind it -- rather than have the bar lowered.
          python -m pytest -q -o addopts= -rs \
            --junit-xml=clerk-junit.xml \
            tests/test_local_clerk_integration.py \
            tests/test_model_passport_live_integration.py

      - name: Upload live local clerk test results
        uses: actions/upload-artifact@v4
        with:
          name: clerk-junit
          path: clerk-junit.xml
          retention-days: 7

      - name: Report Ollama state
        if: ${{ always() }}
        run: |
          docker logs --tail=40 ollama || true
          docker rm -f ollama || true

  golden-cohort-local:
    # Blocker 2 on organ 44 says: "Outside-machine -- this is a laptop run. CI
    # has neither cloud credentials nor the aios-worker/aios-executor images."
    # The honest content of that is not that the numbers are wrong, it is that
    # NOBODY ELSE CAN RE-RUN THEM. Every golden figure the organ carries was
    # produced on one machine.
    #
    # This job fixes the reproducibility half with no cloud credentials at all,
    # by driving the same runner against a local model. It does not reproduce
    # the cloud score and is not meant to -- a CI-sized model will do badly.
    #
    # WHAT IT GATES ON: harness integrity, never score. The distinction is the
    # whole lesson of 2026-08-18, when NINE separate infrastructure defects each
    # produced a low cohort score indistinguishable from model weakness -- a
    # region default, a missing thought_signature, an inherited 1024-token
    # budget, a privacy filter emitting invalid JSON, a stub conftest. A gate on
    # score goes red for all nine and says nothing about which. A gate on
    # integrity goes red for exactly those nine and stays green when the model
    # is merely small. `local-clerk-live` states the same rule: demanding a pass
    # "would create pressure to pick a model that flatters the suite or to
    # loosen the suite until something passes".
    #
    # workflow_dispatch only: a cohort is minutes of model time, and putting it
    # on every push buys noise rather than signal.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start a real Ollama daemon
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "ollama ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull the cohort model
        run: |
          docker exec ollama ollama pull "${AIOS_LLM_MODEL}"
          docker exec ollama ollama list
        env:
          AIOS_LLM_MODEL: qwen2.5:3b

      - name: Build the workload image the missions actually run in
        # Without this the job "passes" while proving nothing. On 2026-08-19 the
        # first real execution of this job scored 0/1 because every verify step
        # died with "Unable to find image 'aios-worker:local'" -- exit 125, the
        # docker daemon refusing to start a container -- and the integrity gate
        # reported OK. AIOS_APPROVED_EXECUTION_BACKEND defaults to "container"
        # and AIOS_CONTAINER_IMAGE to aios-worker:local, so a golden mission
        # CANNOT verify anything without this image, however good the model is.
        #
        # The worker sits behind compose's `build-only` profile precisely so it
        # is never started as a service; it has to be built by name. This is the
        # same defect that took release-authority down on 2026-08-11, recurring
        # in a new job because the conformance rule was file-scoped and this
        # file already said "build worker" somewhere else.
        env:
          # `docker compose` parses the WHOLE file before building anything,
          # so building only `worker` still interpolates grafana's and the
          # executor's variables. Without these the build dies with
          # "required variable ... is missing a value" and never reaches the
          # image -- which is how the first attempt at this fix failed.
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
        run: |
          docker compose --profile build-only build worker
          docker image inspect aios-worker:local >/dev/null

      - name: Start the backend on its own instance
        env:
          AIOS_API_PORT: "8300"
          AIOS_PROBE_BASE: http://127.0.0.1:8300
          AIOS_DATA_DIR: ${{ runner.temp }}/cohort-data
          AIOS_LLM_MODEL: qwen2.5:3b
          # The BACKEND makes the Ollama call, so the timeout belongs here.
          # 120s (the default) is a laptop-with-a-GPU number; this runner is
          # 2 CPU cores with no accelerator.
          AIOS_LLM_TIMEOUT_S: "600"
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          mkdir -p "${AIOS_DATA_DIR}"
          nohup python -m uvicorn aios.api.main:app             --host 127.0.0.1 --port 8300 > backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8300/health >/dev/null; then
              echo "backend ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8300/health >/dev/null

      - name: Run one golden mission against the local model
        env:
          AIOS_API_PORT: "8300"
          AIOS_PROBE_BASE: http://127.0.0.1:8300
          AIOS_PROBE_HOST: localhost:8300
          AIOS_DATA_DIR: ${{ runner.temp }}/cohort-data
          AIOS_LLM_MODEL: qwen2.5:3b
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          # One mission, not five: this proves the harness runs off the laptop,
          # and a full cohort on a small local model is minutes of runtime for
          # no extra evidence about reproducibility.
          #
          # `|| true` because the runner exits non-zero on a low SCORE, which is
          # expected here. The gate below reads the log and fails only on a
          # broken harness.
          python tools/golden_mission_runner.py run             --mission tdd-workflow             --model ollama.qwen2.5:3b 2>&1 | tee cohort.log || true

      - name: Assert the harness ran (never that the model scored)
        run: python scripts/ci_local_cohort_check.py cohort.log

      - name: Upload the cohort log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-cohort-local
          path: |
            cohort.log
            backend.log
          retention-days: 14

      - name: Report daemon state
        if: ${{ always() }}
        run: |
          docker logs --tail=40 ollama || true
          docker rm -f ollama || true

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Enforce monotonic frontend warning budget
        run: |
          ./node_modules/.bin/eslint . --format json > /tmp/gagos-eslint-report.json
          node ../scripts/check_frontend_warning_budget.mjs /tmp/gagos-eslint-report.json

      - name: Unit tests + coverage + JUnit report
        # Runs the suite, measures coverage (enforcing per-directory floors in
        # vite.config.js), and emits a JUnit XML for the organ green-contract
        # gate — all in one vitest invocation to avoid the flakiness caused by
        # running the full suite twice in the same job.
        #
        # Organs 48/49/51 cite ONLY frontend integration suites. The
        # twelve-condition gate runs in the Python-only release-authority job,
        # so without the JUnit artifact their C7 has nothing it can verify.
        run: >
          npx vitest run
          --coverage
          --reporter=default
          --reporter=junit
          --outputFile.junit=vitest-junit.xml

      - name: Upload frontend test results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-junit
          path: frontend/vitest-junit.xml
          retention-days: 7

      - name: Production build
        run: npm run build

  frontend:
    needs: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Frontend gate
        run: echo "Frontend tests and build passed"

  release-authority:
    # This job is intentionally separate from the platform matrix: it checks
    # the shipped topology and architecture invariants once on Linux, where
    # the production container toolchain is available.
    needs: [backend-tests, frontend-tests, local-clerk-live]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The release-authority job runs the tested-SHA ancestry regression
          # test. A shallow checkout would make that test skip precisely when
          # the history needed to catch an orphaned attestation is absent.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend and release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses ruff==0.9.10

      - name: Tracked-source secret scan
        run: python scripts/security_scan.py

      - name: Compile and architecture conformance
        run: |
          python -m compileall -q aios tests scripts
          python -m pytest -q -o addopts='' \
            tests/test_release_conformance.py \
            tests/test_ledger_verification_sha.py \
            tests/test_launcher.py \
            tests/test_governance.py \
            tests/test_v1_declaration.py \
            tests/test_route_registry_conformance.py \
            tests/test_operations.py \
            tests/test_executor_service.py \
            tests/test_deployment_hardening.py \
            tests/test_organ_release_conformance.py

      - name: Download frontend test results
        # Produced by frontend-tests, which is a required `needs:` dependency,
        # so this is the same commit's real vitest outcomes -- not a stale or
        # unrelated run.
        uses: actions/download-artifact@v4
        with:
          name: frontend-junit
          path: frontend-junit

      - name: Download live local clerk test results
        # Same contract as the frontend artifact above: local-clerk-live is a
        # required `needs:` dependency, so this is this commit's real run
        # against a real Ollama daemon. Organs 35 and 37 declare
        # tests/test_local_clerk_integration.py as their integration suite and
        # it is env-gated, so without this the gate sees it all-skipped and C7
        # fails -- correctly.
        uses: actions/download-artifact@v4
        with:
          name: clerk-junit
          path: clerk-junit

      - name: Verify organ ledger and release manifest contracts
        # PR 0 (green-contract enforcement): fails fast, before any Docker
        # build below, the moment a green claim or the release manifest
        # drifts from reality -- a stale source_commit_sha or a stale
        # tracked-file hash is exactly the bug class that shipped silently
        # before this step existed (see scripts/build_release_manifest.py's
        # own docstring for the real incident that motivated it).
        #
        # Phase 1 ordinary-CI tip gate: --require-sha-ancestry. Exact tip
        # equality (--strict-release) remains the release-tag / workflow_dispatch
        # job below; a commit cannot truthfully self-stamp its own SHA.
        #
        # C6/C7/C9 now EXECUTE the tests each green organ cites, instead of
        # passing when the file merely exists on disk (and, for C9, when
        # `known_blockers` merely happened to be empty -- the contract's own
        # forbidden anti-pattern). That costs this job real minutes; a release
        # gate that certifies suites it never ran is not worth its runtime.
        #
        # --frontend-junit: the REAL vitest outcomes from the frontend-tests
        # job on this same commit, downloaded above. Frontend suites therefore
        # count as executed-and-passed rather than being waved through, which
        # matters for organs 48/49/51 whose integration suites are frontend-only.
        #
        # --allow-unexecuted-frontend stays as the fallback for any suite the
        # report does not cover: unverified is recorded honestly, never as
        # passing. A condition still fails when NONE of its suites proved
        # anything, so this cannot become a blanket free pass.
        #
        # The twelve-condition gate itself now runs AFTER the executor
        # topology, further down -- see "Verify the twelve-condition green
        # contract". These two fail fast here, before any Docker build, which
        # is what this step was for.
        #
        # build_organ_ledger_doc.py --check runs FIRST and is a different guard
        # from the manifest check below it. The manifest pins a hash of
        # GAGOS_54_ORGANS.md, which proves the file has not changed since it was
        # blessed -- it says nothing about whether the file is TRUE. That is how
        # the doc sat at 38 green / 16 yellow for two days after the ledger moved
        # to 46/8, with this step passing the whole time. This check compares the
        # doc's generated status region against the ledger itself, so prose that
        # merely agrees with its own old hash now fails.
        #
        # check_organism_seam.py guards the OTHER hand-maintained seam: the
        # backend event vocabulary (aios/core/events.py) against the organism's
        # (cognitionBus.ts + livingMirrorRegistry.ts). A backend event with no
        # frontend counterpart is a real state the interface cannot represent at
        # all -- the UI-side form of law X. It ratchets against a named budget in
        # .aios/state/organism_seam_budget.json that may only shrink.
        #
        # spine_mutation_probe --check breaks the frozen spine's fail-closed
        # behaviour on purpose, in memory, and fails if anything survives -- i.e.
        # if broken security code goes unnoticed. It is the mechanical answer to
        # "organs 1-5's tests were written by the party that wrote the code".
        # Fast (six targeted AST mutations, no pytest subprocess), so it runs on
        # every build rather than on demand.
        run: |
          python scripts/build_organ_ledger_doc.py --check
          python scripts/check_organism_seam.py --check
          python scripts/spine_mutation_probe.py --check
          python scripts/build_release_manifest.py --check
          python scripts/verify_organ_contracts.py --require-sha-ancestry

      - name: Ruff check and format gate
        run: |
          ruff check \
            aios/operations aios/application/governance \
            aios/application/executor aios/infrastructure/executor \
            aios/executor_service.py aios/launcher.py \
            scripts/security_scan.py scripts/generate_sbom.py \
            scripts/build_release_manifest.py scripts/verify_organ_contracts.py \
            scripts/build_organ_ledger_doc.py tests/test_organ_ledger_doc.py \
            scripts/check_organism_seam.py tests/test_organism_seam.py \
            scripts/spine_mutation_probe.py tests/test_spine_mutation_probe.py \
            tests/test_spine_invariants.py \
            tests/test_governance_red_team_corpus.py \
            tests/test_release_conformance.py tests/test_ledger_verification_sha.py \
            tests/test_launcher.py \
            tests/test_governance.py tests/test_v1_declaration.py \
            tests/test_operations.py \
            tests/test_executor_service.py tests/test_executor_client.py \
            tests/test_executor_integration.py tests/test_runtime_worker_container.py \
            tests/test_organ_release_conformance.py
          ruff format --check \
            scripts/security_scan.py scripts/generate_sbom.py \
            scripts/build_release_manifest.py scripts/verify_organ_contracts.py \
            scripts/build_organ_ledger_doc.py tests/test_organ_ledger_doc.py \
            scripts/check_organism_seam.py tests/test_organism_seam.py \
            scripts/spine_mutation_probe.py tests/test_spine_mutation_probe.py \
            tests/test_spine_invariants.py \
            tests/test_governance_red_team_corpus.py \
            tests/test_release_conformance.py tests/test_ledger_verification_sha.py \
            tests/test_launcher.py \
            tests/test_governance.py tests/test_v1_declaration.py \
            tests/test_operations.py tests/test_executor_service.py \
            tests/test_executor_client.py tests/test_executor_integration.py \
            tests/test_runtime_worker_container.py \
            tests/test_organ_release_conformance.py \
            aios/executor_service.py aios/launcher.py \
            aios/application/governance aios/application/executor \
            aios/infrastructure/executor

      - name: Validate production Compose topology
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
        run: docker compose config --quiet

      - name: Start private Executor Service topology
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
          AIOS_PROFILE: production
        run: |
          touch .env
          # Both services intentionally run as UID 65534. The checkout-owned
          # bind mount must therefore be writable before the control-plane
          # probe stages its disposable workspace.
          mkdir -p data/executor-workspaces
          chmod 0777 data data/executor-workspaces
          export AIOS_DOCKER_SOCKET_GID="$(stat -c '%g' /var/run/docker.sock)"
          export AIOS_EXECUTOR_HOST_WORKSPACE_ROOT="$(pwd)/data/executor-workspaces"
          # Build the disposable workload image the executor launches per job.
          # It is NOT a service -- it sits behind the `build-only` profile and
          # is never started here -- so a plain `compose up executor` skips it
          # and every job then dies on "image not found". That is exactly how
          # this job broke: AIOS_CONTAINER_IMAGE used to default to
          # `aios-executor:local`, which this step already built by accident,
          # so repointing it at its own image left CI referencing an image
          # nothing built. `tests/test_release_conformance.py` now pins the
          # rule so the next repoint fails in review, not on master.
          docker compose --profile build-only build worker
          # Keep only the lightweight privileged service resident. The
          # control-plane proof below runs as a one-shot container so CI does
          # not need a second Python interpreter inside the live API process.
          docker compose up -d --build --wait executor

      - name: Report private Executor Service state
        if: ${{ always() }}
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
        run: |
          docker compose ps
          docker compose logs --no-color --tail=80 executor

      - name: Prove private Executor Service isolation
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
          AIOS_PROFILE: production
        run: |
          export AIOS_EXECUTOR_HOST_WORKSPACE_ROOT="$(pwd)/data/executor-workspaces"
          docker compose run --rm --no-deps --use-aliases --build \
            -e AIOS_EXECUTOR_INTEGRATION=1 aios \
            python -m pytest -q -o addopts= tests/test_executor_integration.py

      # Organ 40's one remaining named gap: failure/timeout are proven above,
      # but restart resilience specifically was not. The control-plane
      # container intentionally never receives the Docker socket (asserted by
      # test_executor_integration.py itself), so it cannot restart a sibling
      # container from inside a test -- this can only be proven from the
      # runner, which is exactly what this CI job (and no local sandbox
      # without Docker) can do.
      #
      # This step used to be `docker compose restart executor` followed by
      # `docker compose up -d --wait executor`, with a comment asserting that
      # exporting AIOS_DOCKER_SOCKET_GID kept the resolved config identical so
      # `up` "only waits, never recreates". THAT WAS FALSE, and the job logs
      # said so plainly in every run that ever executed it:
      #
      #   Container aios-executor-1  Restarting     <- the real restart
      #   Container aios-executor-1  Started
      #   Container aios-executor-1  Recreate       <- up threw it away
      #   Container aios-executor-1  Recreated
      #   Container aios-executor-1  Healthy
      #   aios-executor-1 ... CREATED 16 seconds ago
      #
      # (runs 29989936411, 30751967500, 30756711677 -- the original container
      # was ~110s old by then). So the post-restart suite was exercising a
      # BRAND-NEW container, which is what the pre-restart suite already
      # proved. The socket-GID fix that comment describes was a real bug fix,
      # but it fixed the wrong GID *after* the recreate; it never stopped the
      # recreate itself.
      #
      # So: no `up` here at all. Restart, then poll the ORIGINAL container's
      # health by container id, and assert the id is unchanged afterwards. If
      # anything recreates the container the id lookup fails and this step
      # fails loudly, instead of quietly downgrading into a cold-start test.
      - name: "Restart private Executor Service (organ 40: restart resilience)"
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
          AIOS_PROFILE: production
        run: |
          # Still matches the "Start" step's env exactly. AIOS_DOCKER_SOCKET_GID
          # remains required because docker-compose.yml resolves
          # `group_add: ["${AIOS_DOCKER_SOCKET_GID:-999}"]`, and any command
          # here that re-resolves the service config must not silently fall
          # back to 999.
          export AIOS_DOCKER_SOCKET_GID="$(stat -c '%g' /var/run/docker.sock)"
          export AIOS_EXECUTOR_HOST_WORKSPACE_ROOT="$(pwd)/data/executor-workspaces"

          before="$(docker compose ps -q executor)"
          if [ -z "$before" ]; then
            echo "no executor container is running before the restart"
            exit 1
          fi
          echo "executor container before restart: $before"

          docker compose restart executor

          # Poll the ORIGINAL container by id. If it was replaced rather than
          # restarted, `docker inspect` on this id stops resolving and we time
          # out and fail -- which is the point.
          deadline=$((SECONDS + 120))
          while true; do
            current="$(docker compose ps -q executor 2>/dev/null || true)"
            if [ -n "$current" ] && [ "$current" != "$before" ]; then
              echo "executor was REPLACED, not restarted: $before -> $current"
              echo "a cold start does not prove restart resilience"
              exit 1
            fi
            status="$(docker inspect --format '{{.State.Health.Status}}' "$before" 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "restarted executor never became healthy (last status: $status)"
              docker compose logs --no-color --tail=120 executor
              exit 1
            fi
            sleep 2
          done

          after="$(docker compose ps -q executor)"
          if [ "$before" != "$after" ]; then
            echo "executor was REPLACED, not restarted: $before -> $after"
            echo "a cold start does not prove restart resilience"
            exit 1
          fi
          echo "same container survived the restart and is healthy: $after"
          docker compose ps

      - name: Prove private Executor Service isolation survives a restart
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
          AIOS_PROFILE: production
        run: |
          export AIOS_EXECUTOR_HOST_WORKSPACE_ROOT="$(pwd)/data/executor-workspaces"
          # 0777 on purpose. The container drops to uid 65534 (nobody) -- that
          # unprivileged uid is precisely the isolation property this step
          # exists to prove -- while this directory is created by the runner
          # user, so at the default 0755 the container cannot write its report
          # and pytest dies in sessionfinish with EACCES. The container's uid is
          # the guardrail and must not move; this host-side scratch directory is
          # ephemeral, gitignored, and holds only a JUnit XML, so it is the
          # correct thing to relax.
          mkdir -p executor-junit
          chmod 777 executor-junit
          # Organ 40's ONLY integration suite is this one, and it gates on
          # AIOS_EXECUTOR_INTEGRATION -- so in the twelve-condition gate's own
          # pytest run all 4 tests skip, and C7 correctly reports that nothing
          # was proven. Emitting JUnit from INSIDE the container and mounting
          # it out is what lets the gate see the run that actually happened,
          # rather than lowering the bar for an organ that genuinely passes.
          #
          # This is the post-restart run deliberately: it is the stronger of
          # the two, proving isolation survives `docker compose restart`.
          docker compose run --rm --no-deps --use-aliases --build \
            -e AIOS_EXECUTOR_INTEGRATION=1 \
            -v "$(pwd)/executor-junit:/app/executor-junit" \
            aios \
            python -m pytest -q -o addopts= \
              --junit-xml=/app/executor-junit/executor-junit.xml \
              tests/test_executor_integration.py
          ls -la executor-junit/

      - name: Report private Executor Service state after restart
        if: ${{ always() }}
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
        run: |
          docker compose ps
          docker compose logs --no-color --tail=80 executor

      - name: Verify the twelve-condition green contract
        # Runs HERE, not with the manifest checks above, because it needs
        # evidence that only exists once the executor topology has run:
        #
        #   --frontend-junit  real vitest outcomes (organs 48/49/51, whose
        #                     integration suites are frontend-only)
        #   --extra-junit     the containerized run of
        #                     tests/test_executor_integration.py, which gates
        #                     on AIOS_EXECUTOR_INTEGRATION. Organ 40's ONLY
        #                     integration suite is that file, so without this
        #                     it is all-skipped here and C7 correctly reports
        #                     that nothing was proven.
        #
        # Both paths are now fail-closed: passing a report that does not exist,
        # or one resolving no known test files, exits non-zero rather than
        # quietly proceeding as if it had been supplied.
        env:
          AIOS_VERIFICATION_AUTHORITY_KEY: "ci-verification-authority-key-32-bytes-long!"
          AIOS_PROMOTION_AUTHORITY_KEY: "ci-promotion-authority-key-32-bytes-long!!"
        run: |
          python scripts/verify_organ_twelve_conditions.py \
            --allow-unexecuted-frontend \
            --frontend-junit frontend-junit/vitest-junit.xml \
            --extra-junit executor-junit/executor-junit.xml \
            --extra-junit clerk-junit/clerk-junit.xml

      - name: Run strict GAGOS v1 runtime proof matrix
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_VERIFICATION_AUTHORITY_KEY: "ci-verification-authority-key-32-bytes-long!"
          AIOS_PROMOTION_AUTHORITY_KEY: "ci-promotion-authority-key-32-bytes-long!!"
          CHECKPOINT_AUTHORITY_KEY: "ci-checkpoint-authority-key-32-bytes-long!"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
          AIOS_PROFILE: production
        run: |
          export AIOS_EXECUTOR_HOST_WORKSPACE_ROOT="$(pwd)/data/executor-workspaces"
          docker compose run --rm --no-deps --use-aliases --build \
            -e AIOS_EXECUTOR_URL=http://executor:8081 \
            -e AIOS_EXECUTOR_WORKSPACE_ROOT=/app/data/executor-workspaces \
            -e AIOS_EXECUTOR_REMOTE_WORKSPACE_ROOT=/workspace/jobs \
            -e AIOS_VERIFICATION_AUTHORITY_KEY \
            -e AIOS_PROMOTION_AUTHORITY_KEY \
            -e CHECKPOINT_AUTHORITY_KEY \
            -v "$(pwd)/frontend:/app/frontend:ro" \
            aios python -m aios.launcher v1-check --strict --json

      - name: Tear down private Executor Service topology
        if: ${{ always() }}
        env:
          AIOS_API_TOKEN: "ci-production-token-012345678901234567890123"
          AIOS_EXECUTOR_TOKEN: "ci-executor-token-012345678901234567"
          AIOS_EXECUTOR_HOST_WORKSPACE_ROOT: "${{ github.workspace }}/data/executor-workspaces"
          AIOS_GRAFANA_ADMIN_PASSWORD: "ci-grafana-password"
        run: docker compose down -v --remove-orphans

      - name: Generate source manifest SBOM
        run: python scripts/generate_sbom.py --output sbom.cdx.json

      - name: Generate dependency license inventory
        run: pip-licenses --format=json > license-report.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: gagos-release-evidence
          path: |
            sbom.cdx.json
            license-report.json

  release-strict-gate:
    # Organ 23's release-tagging gate. Exact tip equality for green
    # last_verified_sha + manifest source_commit_sha. Chicken-egg: a commit
    # cannot self-stamp its own SHA — run this at an evidence tip (or after
    # the tip-alignment procedure in release/phase6/STRICT_RELEASE_PROCEDURE.md).
    # Ordinary push/PR CI uses --require-sha-ancestry above instead.
    # Also runs on gagos-release-* tags so a tagged evidence tip is teeth, not
    # only manual workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/gagos-release-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Strict release validation must be able to inspect the history of
          # every recorded tested SHA rather than silently skipping ancestry
          # checks in a shallow checkout.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Materialize exact-tip manifest for strict gate
        # A committed manifest can only know its parent commit's SHA. The
        # strict release check is intentionally staged in CI's ephemeral
        # workspace, where the checked-out HEAD is known and the manifest can
        # be regenerated immediately before validation.
        run: |
          python scripts/build_release_manifest.py --check
          python scripts/build_release_manifest.py

      - name: Strict release-gate check (organ 23)
        run: |
          python scripts/build_release_manifest.py --check
          python scripts/verify_organ_contracts.py --strict-release
