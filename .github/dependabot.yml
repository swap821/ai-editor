version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    ignore:
      # radon 6.0.1 (the latest release) requires `mando >=0.6,<0.8`, so any
      # bump to 0.8.x makes requirements.txt unresolvable and every backend job
      # dies at `pip install` with ResolutionImpossible -- before a single test
      # runs. Dependabot cannot see that constraint because mando is pinned
      # directly here as well as pulled in by radon.
      #
      # Lift this the moment a radon release accepts mando 0.8.
      - dependency-name: "mando"
        versions: [">=0.8"]
      # sympy 1.14.0 (the latest release) requires `mpmath >=1.1.0,<1.4`.
      # Identical shape to mando/radon: the bump resolves to nothing and takes
      # the whole install down. Lift when sympy accepts mpmath 1.4.
      - dependency-name: "mpmath"
        versions: [">=1.4"]
      # transformers 5.15.0 requires `tokenizers >=0.22.0,<=0.23.0`. A grouped
      # bump has pushed past that ceiling three times now and broken install
      # each time. Lift when transformers widens the range.
      - dependency-name: "tokenizers"
        versions: [">0.23.0"]
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    ignore:
      # 3.0.5 ships a typing regression that makes every effect's props
      # unusable. Its prop type is
      #
      #   Omit<Partial<ConstructorParameters<typeof Effect>[0]>, 'offset'> & {...}
      #
      # and that constructor parameter is OPTIONAL, so the inner type is
      # `{...} | undefined`. `keyof (A | undefined)` is `never`, so the Omit
      # collapses to `{}` and every real prop -- radialModulation,
      # modulationOffset -- becomes an excess-property error:
      #
      #   PostFX.tsx(182,11): error TS2322
      #
      # This is upstream's bug, not ours; 3.0.4 types the same props fine.
      # Lift when a release fixes the Omit-over-optional-union.
      - dependency-name: "@react-three/postprocessing"
        versions: [">3.0.4"]
      # TypeScript 7 has no linting story yet. @typescript-eslint/eslint-plugin
      # 8.67.0 -- the LATEST release -- declares `typescript >=4.8.4 <6.1.0`, so
      # npm refuses the install outright:
      #
      #   npm error ERESOLVE could not resolve
      #   Found: typescript@7.0.2 ... peer typescript@">=4.8.4 <6.1.0"
      #
      # Forcing it would mean --legacy-peer-deps and running the linter against
      # a compiler it does not support, which trades a real guarantee for a
      # version number. Lift when typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      frontend-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "deps"
